<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fastamor - AI Travel Concierge</title>
    <meta name="description" content="Your personal AI travel assistant. Find the best flights, hotels, tours and transfers instantly." />
    <link rel="icon" type="image/png" href="/media/6172d55e66bb86428408.png" />
    <meta property="og:site_name" content="Fastamor" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fastamor - AI Travel Concierge" />
    <meta property="og:description" content="Your personal AI travel assistant. Find the best flights, hotels, tours and transfers instantly." />
    <meta property="og:image" content="https://www.fastamor.com/media/6172d55e66bb86428408.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="alternate" hreflang="x-default" href="https://www.fastamor.com/" />
    <link rel="preload" href="/fonts/cairo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/cairo.css">
    <script>
      // Travelpayouts Drive: load after the page is interactive so it never blocks start-up.
      window.addEventListener('load', function () {
        (window.requestIdleCallback || function (f) { setTimeout(f, 1500); })(function () {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://tp-em.com/NTE0NjIy.js?t=514622';
          document.head.appendChild(s);
        });
      });
    </script>
    <style>
      /* Server-rendered fallback (for search engines) stays hidden behind a brief
         branded loader until the app mounts, so visitors never see unstyled HTML. */
      #root[data-ssr] > * { visibility: hidden; }
      #root[data-ssr]::before {
        content: ""; position: fixed; inset: 0; z-index: 9999;
        background: #F7F8FC url(/media/6172d55e66bb86428408.png) center 45% / 72px auto no-repeat;
      }
      #root[data-ssr]::after {
        content: ""; position: fixed; z-index: 10000; left: 50%; top: calc(45% + 56px);
        width: 28px; height: 28px; margin-left: -14px; border-radius: 50%;
        border: 3px solid #E1E4F0; border-top-color: #3550C8; animation: fa-spin .8s linear infinite;
      }
      @keyframes fa-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #root[data-ssr]::after { animation: none; } }
    </style>
    <noscript><style>#root[data-ssr] > * { visibility: visible; } #root[data-ssr]::before, #root[data-ssr]::after { display: none; }</style></noscript>
    <script>
      // Safety net: if the app has not mounted after 8 s, show the server HTML rather than a loader forever.
      setTimeout(function () { var r = document.getElementById('root'); if (r) r.removeAttribute('data-ssr'); }, 8000);
    </script>
  </head>
  <body class="bg-[#FFFDF7] m-0 p-0">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
